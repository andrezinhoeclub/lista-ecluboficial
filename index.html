<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-CLUB | Estacionamento</title>
<link rel="icon" type="image/png" href="../logo.png">

<!-- ===== ENDERECO CURTO DO VALLET =====
     O arquivo de verdade e o vallet_eclub.html, la na raiz. Esta pagina existe
     so para o endereco curto funcionar:

         abreaporta.com.br/estacionamento

     ELA PRECISA SE CHAMAR  estacionamento/index.html  — dentro da pasta.
     Se for colada por cima de outro arquivo, ela PERCEBE e nao faz nada, em vez
     de mandar o navegador para si mesma e ficar piscando sem parar.

     O que vier depois do endereco (?v=52, por exemplo) vai junto. -->

<script>
  (function () {
    var destino = '../vallet_eclub.html';
    try {
      var alvo = new URL(destino, window.location.href);

      // A trava: se o destino for esta mesma pagina, este arquivo foi colado no
      // lugar errado. Melhor mostrar o recado do que entrar em volta sem fim.
      if (alvo.pathname === window.location.pathname) {
        document.addEventListener('DOMContentLoaded', function () {
          var aviso = document.getElementById('aviso');
          if (aviso) {
            aviso.textContent = 'Este arquivo está no lugar errado. Ele deveria se chamar estacionamento/index.html.';
            aviso.style.color = '#fca5a5';
          }
        });
        return;
      }

      window.location.replace(alvo.pathname + window.location.search + window.location.hash);
    } catch (e) {
      window.location.href = destino;
    }
  })();
</script>

<style>
  html,body{margin:0;padding:0}
  body{min-height:100vh;background:#050508;color:#f4f4f5;
    font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;

    text-transform:uppercase;color:#71717a;line-height:1.8}
  a{display:block;padding:16px;border-radius:16px;text-decoration:none;
    background:#38bdf8;color:#05202e;
    font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
</style>
</head>
<body>
  <div class="caixa">
    <img src="../logo.png" alt="E-Club">
    <p id="aviso">Abrindo o estacionamento…</p>
    <a href="../vallet_eclub.html">Abrir agora</a>
  </div>
</body>
</html>

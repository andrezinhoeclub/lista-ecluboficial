<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-CLUB Curitiba</title>
<meta name="description" content="Entre na lista das festas do E-Club Curitiba.">
<meta name="theme-color" content="#050508">
<link rel="icon" type="image/png" href="logo.png">

<!-- ===== A PORTA DA RUA =====
     Quem digita so "abreaporta.com.br" cai aqui, e daqui vai direto para a
     lista das festas.

     Ate agora a raiz estava vazia. Endereco vazio nao fica vazio na pratica: o
     navegador completa sozinho com a ultima pagina visitada do mesmo site, e
     por isso o estacionamento aparecia para quem tinha aberto ele antes.

     NAO existe <meta refresh> aqui, de proposito: ele nao tem como perguntar
     nada antes de agir. Se este arquivo for colado por cima do listas.html, o
     meta mandaria a pagina para ela mesma e ela ficaria piscando para sempre —
     foi exatamente o que aconteceu no estacionamento. A trava abaixo so
     funciona porque quem redireciona e o JavaScript, que consegue olhar para
     onde esta indo antes de ir.

     Duas camadas:
       1. O location.replace, instantaneo e sem deixar rastro no historico
          (sem ele o botao "voltar" traria o visitante para ca de novo, num
          vai-e-volta sem fim).
       2. O botao na tela, se a primeira for bloqueada.

     O que vier depois do endereco (?ref=jhow, ?id=L1) vai junto: e assim que os
     links do promoter continuam funcionando se alguem tirar o "listas.html". -->

<script>
  (function () {
    var destino = 'listas.html';
    try {
      var alvo = new URL(destino, window.location.href);
      // Se este arquivo for colado no lugar errado, ele apontaria para si mesmo
      // e a tela ficaria piscando sem parar. Aqui ele percebe e para.
      if (alvo.pathname === window.location.pathname) {
        document.addEventListener('DOMContentLoaded', function () {
          var aviso = document.getElementById('aviso');
          if (aviso) {
            aviso.textContent = 'Este arquivo está no lugar errado. Ele deveria se chamar index.html, na raiz.';
            aviso.style.color = '#fca5a5';
          }
        });
        return;
      }
      window.location.replace(alvo.pathname + window.location.search + window.location.hash);
    } catch (e) {
      window.location.href = destino;
    }
  })();
</script>

<style>
  html,body{margin:0;padding:0}
  body{min-height:100vh;background:#050508;color:#f4f4f5;
    font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:28px 20px;text-align:center}
  .caixa{max-width:330px}
  img{width:82px;height:auto;margin:0 auto 22px;display:block;
    filter:drop-shadow(0 0 26px rgba(56,189,248,.24))}
  p{margin:0 0 22px;font-size:11px;font-weight:800;letter-spacing:.14em;
    text-transform:uppercase;color:#71717a;line-height:1.8}
  a{display:block;padding:17px;border-radius:17px;text-decoration:none;
    background:linear-gradient(135deg,#facc15,#eab308);color:#1c1300;
    font-size:12.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;
    box-shadow:0 12px 30px rgba(234,179,8,.22)}
</style>
</head>
<body>
  <div class="caixa">
    <img src="logo.png" alt="E-Club">
    <p id="aviso">Abrindo as festas…</p>
    <a href="listas.html">Ver as festas</a>
  </div>
</body>
</html>

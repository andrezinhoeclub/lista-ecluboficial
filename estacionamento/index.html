<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-CLUB | Estacionamento</title>

<!-- ===== ENDERECO CURTO DO VALLET =====
     O arquivo de verdade e o vallet_eclub.html, la na raiz. Esta pasta existe
     so para o endereco curto continuar funcionando:

         abreaporta.com.br/estacionamento

     No dominio antigo isso era um encaminhamento configurado fora do GitHub.
     Aqui e uma pagina que manda o navegador para o arquivo certo.

     Tres camadas, de proposito:
       1. O <meta refresh> abaixo, que funciona ate com JavaScript desligado.
       2. O location.replace, que e instantaneo e NAO deixa rastro no historico
          (sem ele, o botao "voltar" do celular traria o operador para ca de
          novo, num vai-e-volta sem fim).
       3. O link na tela, para o caso de as duas primeiras serem bloqueadas.

     O que vier depois do endereco (?v=52, por exemplo) vai junto. -->

<meta http-equiv="refresh" content="0; url=../vallet_eclub.html">
<script>
  (function () {
    try {
      var extra = window.location.search + window.location.hash;
      window.location.replace('../vallet_eclub.html' + extra);
    } catch (e) {
      window.location.href = '../vallet_eclub.html';
    }
  })();
</script>

<style>
  html,body{margin:0;padding:0}
  body{min-height:100vh;background:#050508;color:#f4f4f5;
    font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:28px 20px;text-align:center}
  .caixa{max-width:320px}
  img{width:74px;height:auto;margin:0 auto 20px;display:block;opacity:.9}
  p{margin:0 0 20px;font-size:11px;font-weight:800;letter-spacing:.16em;
    text-transform:uppercase;color:#71717a;line-height:1.8}
  a{display:block;padding:16px;border-radius:16px;text-decoration:none;
    background:#38bdf8;color:#05202e;
    font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
</style>
</head>
<body>
  <div class="caixa">
    <img src="../logo.png" alt="E-Club">
    <p>Abrindo o estacionamento…</p>
    <a href="../vallet_eclub.html">Abrir agora</a>
  </div>
</body>

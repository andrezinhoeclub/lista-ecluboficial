<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portaria (novo)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #0a0a0a;
    color: #e4e4e7;
    min-height: 100vh;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 24px 16px; }
  h1 {
    font-size: 14px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #fff;
    font-weight: 900;
    margin: 0 0 20px;
  }
  input, select, button {
    width: 100%;
    font-size: 14px;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #27272a;
    background: #18181b;
    color: #fff;
    margin-bottom: 10px;
  }
  button {
    background: #fff;
    color: #000;
    font-weight: 900;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.05em;
    cursor: pointer;
    border: none;
  }
  button:active { opacity: 0.8; }
  #erroLogin { color: #f87171; font-size: 12px; margin-bottom: 10px; min-height: 16px; }
  .card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 14px;
    border-radius: 12px;
    background: #18181b;
    border: 1px solid #27272a;
    margin-bottom: 8px;
  }
  .card.entrou { opacity: 0.5; }
  .card .info { display: flex; flex-direction: column; }
  .card .nome { font-weight: 700; font-size: 13px; text-transform: uppercase; }
  .card .tipo { font-size: 10px; color: #a1a1aa; text-transform: uppercase; }
  .card button {
    width: auto;
    padding: 10px 14px;
    margin: 0;
    font-size: 10px;
  }
  .ok-badge {
    font-size: 10px;
    font-weight: 900;
    color: #4ade80;
    text-transform: uppercase;
  }
  #placar {
    font-size: 11px;
    color: #a1a1aa;
    text-transform: uppercase;
    margin-bottom: 14px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="login">
    <h1>Portaria &mdash; entrar</h1>
    <div id="erroLogin"></div>
    <input id="email" type="email" placeholder="e-mail" autocomplete="username">
    <input id="senha" type="password" placeholder="senha" autocomplete="current-password">
    <button id="btnEntrar">Entrar</button>
  </div>

  <div id="painel" style="display:none">
    <h1>Portaria</h1>
    <select id="eventoSelect"></select>
    <input id="busca" placeholder="Buscar nome...">
    <div id="placar"></div>
    <div id="lista"></div>
  </div>
</div>

<script>
  // --- Configuração da conexão com o Supabase ---
  const SUPABASE_URL = 'https://srzhcthufewpzeuuqbqy.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_QObRVvgS4fqeJXNDtluNjw_3pQuKsnE';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let reservasCache = [];

  document.getElementById('btnEntrar').onclick = async () => {
    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value;
    const erro = document.getElementById('erroLogin');
    erro.textContent = '';
    const { error } = await supabase.auth.signInWithPassword({ email, password: senha });
    if (error) { erro.textContent = 'E-mail ou senha inválidos.'; return; }
    iniciar();
  };

  async function iniciar() {
    document.getElementById('login').style.display = 'none';
    document.getElementById('painel').style.display = 'block';
    await carregarEventos();
    ligarTempoReal();
  }

  async function carregarEventos() {
    const { data, error } = await supabase.from('eventos').select('*').eq('status', 'online').order('data');
    const sel = document.getElementById('eventoSelect');
    if (error || !data || data.length === 0) {
      sel.innerHTML = '<option>Nenhum evento no ar</option>';
      return;
    }
    sel.innerHTML = data.map(e => `<option value="${e.id}">${e.nome}</option>`).join('');
    await carregarReservas();
  }

  document.getElementById('eventoSelect').onchange = carregarReservas;
  document.getElementById('busca').oninput = renderLista;

  async function carregarReservas() {
    const eventoId = document.getElementById('eventoSelect').value;
    if (!eventoId) { reservasCache = []; renderLista(); return; }
    const { data, error } = await supabase.from('reservas').select('*').eq('evento_id', eventoId).order('nome');
    reservasCache = error ? [] : data;
    renderLista();
  }

  function renderLista() {
    const termo = document.getElementById('busca').value.toLowerCase();
    const filtradas = reservasCache.filter(r => r.nome.toLowerCase().includes(termo));
    const entraram = reservasCache.filter(r => r.entrou).length;
    document.getElementById('placar').textContent = `${entraram} / ${reservasCache.length} entraram`;
    document.getElementById('lista').innerHTML = filtradas.map(r => `
      <div class="card ${r.entrou ? 'entrou' : ''}">
        <div class="info">
          <span class="nome">${escapeHtml(r.nome)}</span>
          <span class="tipo">${escapeHtml(r.tipo_entrada || '')}</span>
        </div>
        ${r.entrou
          ? '<span class="ok-badge">&check; Entrou</span>'
          : `<button onclick="checkin('${r.id}')">Check-in</button>`}
      </div>
    `).join('') || '<p style="text-align:center;color:#71717a;font-size:12px;">Nenhuma reserva encontrada.</p>';
  }

  window.checkin = async (id) => {
    const { data, error } = await supabase.rpc('fazer_checkin', { p_reserva_id: id });
    if (error) { alert(error.message); return; }
    const idx = reservasCache.findIndex(r => r.id === id);
    if (idx > -1) reservasCache[idx] = data;
    renderLista();
  };

  // Tempo real: a tela se atualiza sozinha quando QUALQUER dispositivo faz um
  // check-in, sem precisar ficar perguntando pro servidor de tempos em tempos.
  function ligarTempoReal() {
    supabase.channel('reservas-realtime')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'reservas' }, payload => {
        const idx = reservasCache.findIndex(r => r.id === payload.new.id);
        if (idx > -1) { reservasCache[idx] = payload.new; renderLista(); }
      })
      .subscribe();
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
</script>
</body>
</html>

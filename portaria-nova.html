<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portaria (novo)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:ital,wght@1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="eclub-v2.css">
</head>
<body>
<div class="tela-login" id="login">
  <div class="login-card">
    <div class="login-logo-wrap">
      <img src="logo-eclub.png" alt="E-Club" class="login-logo-img"
        onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='flex';">
      <div id="logoFallback" class="login-logo-fallback" style="display:none">e</div>
    </div>
    <div class="login-selo">Acesso Restrito</div>
    <h1 class="login-titulo">Portaria</h1>
    <div id="erroLogin" class="erro"></div>
    <input id="email" type="email" placeholder="E-mail" autocomplete="username">
    <input id="senha" type="password" placeholder="Senha" autocomplete="current-password">
    <button id="btnEntrar">Entrar com segurança</button>
  </div>
</div>

<div class="wrap" id="painel" style="display:none">
  <h1>Portaria</h1>
  <select id="eventoSelect"></select>
  <input id="busca" placeholder="Buscar nome...">
  <div id="placar"></div>
  <div id="lista"></div>
</div>

<script>
  // --- Configuração da conexão com o Supabase ---
  // OBS: a biblioteca do CDN já cria uma variável global chamada "supabase",
  // por isso o cliente aqui se chama "sb" (nunca "supabase") — evita o erro
  // "Identifier 'supabase' has already been declared".
  const SUPABASE_URL = 'https://srzhcthufewpzeuuqbqy.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_QObRVvgS4fqeJXNDtluNjw_3pQuKsnE';
  // storageKey separado por tela: evita que o login da portaria e o do
  // promoter (ou de qualquer outra tela) se sobrescrevam quando testados
  // no mesmo navegador — cada tela guarda sua própria sessão.
  // "storage: sessionStorage" (em vez do localStorage padrão): o login não
  // fica guardado depois que o navegador fecha ou o aparelho reinicia —
  // precisa entrar de novo a cada vez que abrir a tela.
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { storageKey: 'sb-portaria-auth', storage: window.sessionStorage }
  });

  let reservasCache = [];

  // Enter no e-mail ou na senha já tenta entrar, sem precisar clicar no botão.
  ['email', 'senha'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('btnEntrar').click();
    });
  });

  document.getElementById('btnEntrar').onclick = async () => {
    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value;
    const erro = document.getElementById('erroLogin');
    erro.textContent = '';
    const { error } = await sb.auth.signInWithPassword({ email, password: senha });
    if (error) { erro.textContent = 'E-mail ou senha inválidos.'; return; }

    // Confere se essa conta ainda tem a permissão de portaria ligada —
    // sem isso, o login passava mas o acesso de verdade ficava de fora
    // (bloqueado só no banco), deixando a tela abrir sem motivo.
    const { data: podeAcessar, error: erroPermissao } = await sb.rpc('posso_portaria');
    if (erroPermissao || !podeAcessar) {
      erro.textContent = 'Essa conta não tem (ou perdeu) o acesso à tela de Portaria.';
      await sb.auth.signOut();
      return;
    }

    iniciar();
  };

  async function iniciar() {
    document.getElementById('login').style.display = 'none';
    document.getElementById('painel').style.display = 'block';
    await carregarEventos();
    ligarTempoReal();
  }

  async function carregarEventos() {
    const { data, error } = await sb.from('eventos').select('*').eq('ativo', true).order('data');
    const sel = document.getElementById('eventoSelect');
    if (error || !data || data.length === 0) {
      sel.innerHTML = '<option>Nenhum evento no ar</option>';
      return;
    }
    sel.innerHTML = data.map(e => `<option value="${e.id}">${e.nome}</option>`).join('');
    await carregarReservas();
  }

  document.getElementById('eventoSelect').onchange = carregarReservas;
  document.getElementById('busca').oninput = renderLista;

  async function carregarReservas() {
    const eventoId = document.getElementById('eventoSelect').value;
    if (!eventoId) { reservasCache = []; renderLista(); return; }
    const { data, error } = await sb.from('reservas').select('*').eq('evento_id', eventoId).order('nome');
    reservasCache = error ? [] : data;
    renderLista();
  }

  function renderLista() {
    const termo = document.getElementById('busca').value.toLowerCase();
    const filtradas = reservasCache.filter(r => r.nome.toLowerCase().includes(termo));
    const entraram = reservasCache.filter(r => r.entrou).length;
    document.getElementById('placar').textContent = `${entraram} / ${reservasCache.length} entraram`;
    document.getElementById('lista').innerHTML = filtradas.map(r => `
      <div class="card ${r.entrou ? 'entrou' : ''}">
        <div class="info">
          <span class="nome">${escapeHtml(r.nome)}</span>
          <span class="tipo">${escapeHtml(r.tipo_entrada || '')}</span>
        </div>
        ${r.entrou
          ? '<span class="ok-badge">&check; Entrou</span>'
          : `<button onclick="checkin('${r.id}')">Check-in</button>`}
      </div>
    `).join('') || '<p style="text-align:center;color:#71717a;font-size:12px;">Nenhuma reserva encontrada.</p>';
  }

  window.checkin = async (id) => {
    const { data, error } = await sb.rpc('fazer_checkin', { p_reserva_id: id });
    if (error) { alert(error.message); return; }
    const idx = reservasCache.findIndex(r => r.id === id);
    if (idx > -1) reservasCache[idx] = data;
    renderLista();
  };

  // Tempo real: a tela se atualiza sozinha tanto quando alguém faz um
  // check-in (UPDATE) quanto quando um promoter adiciona um nome novo na
  // lista (INSERT) — sem precisar ficar perguntando pro servidor de tempos
  // em tempos, nem dar F5 pra ver reserva nova.
  function ligarTempoReal() {
    sb.channel('reservas-realtime')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'reservas' }, payload => {
        const eventoAtual = document.getElementById('eventoSelect').value;
        if (payload.eventType === 'INSERT') {
          if (payload.new.evento_id === eventoAtual && !reservasCache.find(r => r.id === payload.new.id)) {
            reservasCache.push(payload.new);
          }
        } else {
          const idx = reservasCache.findIndex(r => r.id === payload.new.id);
          if (idx > -1) reservasCache[idx] = payload.new;
        }
        renderLista();
      })
      .subscribe();
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
</script>
</body>
</html>

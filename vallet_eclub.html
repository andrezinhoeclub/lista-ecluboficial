<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-CLUB | Estacionamento</title>
<link rel="icon" type="image/png" href="logo.png">

<!-- ===== ENDERECO ANTIGO DO VALLET =====
     O vallet mudou de casa: agora ele mora em /estacionamento.
     Este arquivo ficou aqui so para quem tem o endereco antigo salvo, ou o
     atalho antigo instalado no celular, nao ficar na mao.

     Se for colado no lugar errado, ele percebe e nao faz nada, em vez de
     mandar o navegador para si mesmo e ficar piscando sem parar. -->

<script>
  (function () {
    var destino = 'estacionamento/';
    try {
      var alvo = new URL(destino, window.location.href);
      if (alvo.pathname === window.location.pathname) {
        document.addEventListener('DOMContentLoaded', function () {
          var aviso = document.getElementById('aviso');
          if (aviso) {
            aviso.textContent = 'Este arquivo esta no lugar errado.';
            aviso.style.color = '#fca5a5';
          }
        });
        return;
      }
      window.location.replace(alvo.pathname + window.location.hash);
    } catch (e) {
      window.location.href = destino;
    }
  })();
</script>

<style>
  html,body{margin:0;padding:0}
  body{min-height:100vh;background:#050508;color:#f4f4f5;
    font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:28px 20px;text-align:center}
  .caixa{max-width:330px}
  img{width:74px;height:auto;margin:0 auto 20px;display:block;opacity:.9}
  p{margin:0 0 20px;font-size:11px;font-weight:800;letter-spacing:.14em;
    text-transform:uppercase;color:#71717a;line-height:1.8}
  a{display:block;padding:16px;border-radius:16px;text-decoration:none;
    background:#38bdf8;color:#05202e;
    font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
</style>
</head>
<body>
  <div class="caixa">
    <img src="logo.png" alt="E-Club">
    <p id="aviso">O estacionamento mudou de endereço. Abrindo…</p>
    <a href="estacionamento/">Abrir agora</a>
  </div>
</body>
</html>
